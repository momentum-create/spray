services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spray_wp
      MYSQL_USER: spray
      MYSQL_PASSWORD: spray
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1-php8.2-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: spray
      WORDPRESS_DB_PASSWORD: spray
      WORDPRESS_DB_NAME: spray_wp
    volumes:
      - wp_data:/var/www/html
      - ./php/zz-security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  wp_data:
