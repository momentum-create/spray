# 編集の push 先: momentum-create/spray（origin）→ ここだけ mirror 実行
# Vercel が見る先: Seeker-x1/spray（seeker）→ 直接 push でデプロイ（この workflow は走らない）
name: Sync to Seeker (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mirror:
    # Seeker へ直接 push 時は job ごとスキップ（Secret 不要・失敗通知なし）
    if: github.repository == 'momentum-create/spray'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Seeker-x1/spray
        env:
          SEEKER_PUSH_TOKEN: ${{ secrets.SEEKER_PUSH_TOKEN }}
        run: |
          set -e
          if [ -z "$SEEKER_PUSH_TOKEN" ]; then
            echo "::error::SEEKER_PUSH_TOKEN が未設定。momentum-create/spray → Settings → Secrets → Actions"
            exit 1
          fi
          if [ "$(echo -n "$SEEKER_PUSH_TOKEN" | wc -c)" -lt 20 ]; then
            echo "::error::SEEKER_PUSH_TOKEN が短すぎます。Seeker-x1 で classic PAT (repo) を作り Secret を Update。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SEEKER_URL="https://x-access-token:${SEEKER_PUSH_TOKEN}@github.com/Seeker-x1/spray.git"
          git remote add seeker "$SEEKER_URL"

          echo "=== Test: can we read Seeker-x1/spray? ==="
          if ! git ls-remote seeker HEAD 2>ls-remote.err; then
            if grep -qi 'not found' ls-remote.err; then
              echo "::error::Seeker-x1/spray に接続できません（404）。多くは PAT が無効・期限切れ・Seeker-x1 の spray への repo 権限なし。Seeker-x1 で classic PAT (repo) を再発行し、momentum-create/spray の SEEKER_PUSH_TOKEN を更新してください。"
            else
              echo "::error::Seeker へ接続できません。"
              cat ls-remote.err
            fi
            exit 128
          fi

          echo "=== Push to Seeker-x1/spray ==="
          if git push seeker HEAD:main; then
            echo "Push OK (fast-forward)"
          else
            echo "::warning::通常 push 失敗。force で再試行..."
            git push seeker HEAD:main --force
            echo "Push OK (force)"
          fi

          SEEKER_NAME="${{ secrets.SEEKER_GIT_NAME }}"
          SEEKER_EMAIL="${{ secrets.SEEKER_GIT_EMAIL }}"
          if [ -z "$SEEKER_EMAIL" ]; then
            echo "::warning::SEEKER_GIT_EMAIL 未設定のため Vercel 用空コミットはスキップ（mirror のみ）"
            exit 0
          fi
          SEEKER_NAME="${SEEKER_NAME:-Seeker-x1}"
          git -c user.name="$SEEKER_NAME" -c user.email="$SEEKER_EMAIL" \
            commit --allow-empty -m "chore: trigger Vercel deploy [automated]"
          git push seeker HEAD:main
          echo "Vercel trigger commit pushed (author: $SEEKER_NAME)"
