# Deploy goggle-survey/ as a static GitHub Pages site (no build step).
name: Deploy goggle survey

on:
  push:
    branches: [main]
    paths:
      - "goggle-survey/**"
      - ".github/workflows/goggle-survey-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goggle-survey-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages is configured only on momentum-create/spray (Seeker mirror skips deploy).
    if: github.repository == 'momentum-create/spray'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: goggle-survey

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
