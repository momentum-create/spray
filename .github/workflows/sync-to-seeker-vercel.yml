# momentum-create/spray → Seeker-x1/spray へ mirror（Vercel デプロイ用）
# 認証: SEEKER_DEPLOY_KEY（推奨）または SEEKER_PUSH_TOKEN（classic PAT）
name: Sync to Seeker (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'momentum-create/spray'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Seeker-x1/spray
        env:
          SEEKER_DEPLOY_KEY: ${{ secrets.SEEKER_DEPLOY_KEY }}
          SEEKER_PUSH_TOKEN: ${{ secrets.SEEKER_PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_seeker() {
            if git push seeker HEAD:main; then
              echo "Push OK (fast-forward)"
            else
              echo "::warning::通常 push 失敗。force で再試行..."
              git push seeker HEAD:main --force
              echo "Push OK (force)"
            fi
          }

          if [ -n "$SEEKER_DEPLOY_KEY" ]; then
            echo "=== Auth: Deploy Key (SSH) ==="
            mkdir -p ~/.ssh
            printf '%s\n' "$SEEKER_DEPLOY_KEY" > ~/.ssh/seeker_deploy
            chmod 600 ~/.ssh/seeker_deploy
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/seeker_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git remote add seeker "git@github.com:Seeker-x1/spray.git"
            git ls-remote seeker HEAD
            push_seeker
          elif [ -n "$SEEKER_PUSH_TOKEN" ]; then
            echo "=== Auth: PAT (HTTPS) ==="
            if [ "$(printf '%s' "$SEEKER_PUSH_TOKEN" | wc -c)" -lt 20 ]; then
              echo "::error::SEEKER_PUSH_TOKEN が短すぎます。"
              exit 1
            fi
            case "$SEEKER_PUSH_TOKEN" in
              YOUR_TOKEN*|your_token*) echo "::error::YOUR_TOKEN のままです。実際の ghp_... を Secret に設定してください。"; exit 1 ;;
            esac
            HTTP_CODE=$(curl -s -o /tmp/seeker-api.json -w "%{http_code}" \
              -H "Authorization: Bearer ${SEEKER_PUSH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Seeker-x1/spray")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::PAT で Seeker-x1/spray にアクセスできません (HTTP ${HTTP_CODE})。Seeker-x1 の classic PAT (repo) を使うか、Deploy Key を設定してください: scripts/setup-seeker-deploy-key.ps1"
              exit 1
            fi
            git remote add seeker "https://github.com/Seeker-x1/spray.git"
            AUTH_HEADER="AUTHORIZATION: bearer ${SEEKER_PUSH_TOKEN}"
            GIT_AUTH=(-c "http.https://github.com/.extraheader=${AUTH_HEADER}")
            git "${GIT_AUTH[@]}" ls-remote seeker HEAD
            if git "${GIT_AUTH[@]}" push seeker HEAD:main; then
              echo "Push OK (fast-forward)"
            else
              git "${GIT_AUTH[@]}" push seeker HEAD:main --force
              echo "Push OK (force)"
            fi
          else
            echo "::error::SEEKER_DEPLOY_KEY または SEEKER_PUSH_TOKEN が未設定です。"
            echo "推奨: リポジトリで pnpm run setup:seeker-deploy → Seeker に Deploy Key 登録 → momentum-create の Secret SEEKER_DEPLOY_KEY"
            exit 1
          fi

          SEEKER_NAME="${{ secrets.SEEKER_GIT_NAME }}"
          SEEKER_EMAIL="${{ secrets.SEEKER_GIT_EMAIL }}"
          if [ -z "$SEEKER_EMAIL" ]; then
            echo "::warning::SEEKER_GIT_EMAIL 未設定のため Vercel 用空コミットはスキップ"
            exit 0
          fi
          SEEKER_NAME="${SEEKER_NAME:-Seeker-x1}"
          git -c user.name="$SEEKER_NAME" -c user.email="$SEEKER_EMAIL" \
            commit --allow-empty -m "chore: trigger Vercel deploy [automated]"
          if [ -n "$SEEKER_DEPLOY_KEY" ]; then
            git push seeker HEAD:main
          else
            git "${GIT_AUTH[@]}" push seeker HEAD:main
          fi
          echo "Vercel trigger commit pushed"
