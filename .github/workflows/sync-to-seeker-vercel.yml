# momentum-create/spray -> Seeker-x1/spray (Vercel)
# Auth: SEEKER_DEPLOY_KEY (recommended) or SEEKER_PUSH_TOKEN (classic PAT)
name: Sync to Seeker (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'momentum-create/spray'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Seeker-x1/spray
        env:
          SEEKER_DEPLOY_KEY: ${{ secrets.SEEKER_DEPLOY_KEY }}
          SEEKER_PUSH_TOKEN: ${{ secrets.SEEKER_PUSH_TOKEN }}
          SEEKER_GIT_NAME: ${{ secrets.SEEKER_GIT_NAME }}
          SEEKER_GIT_EMAIL: ${{ secrets.SEEKER_GIT_EMAIL }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          deploy_len=0
          pat_len=0
          [ -n "$SEEKER_DEPLOY_KEY" ] && deploy_len=$(printf '%s' "$SEEKER_DEPLOY_KEY" | wc -c)
          [ -n "$SEEKER_PUSH_TOKEN" ] && pat_len=$(printf '%s' "$SEEKER_PUSH_TOKEN" | wc -c)
          echo "SEEKER_DEPLOY_KEY length: ${deploy_len} bytes"
          echo "SEEKER_PUSH_TOKEN length: ${pat_len} bytes"

          if [ "$deploy_len" -ge 200 ]; then
            echo "=== Auth: Deploy Key (SSH) ==="
            mkdir -p ~/.ssh
            printf '%s\n' "$SEEKER_DEPLOY_KEY" | sed 's/\r$//' > ~/.ssh/seeker_deploy
            chmod 600 ~/.ssh/seeker_deploy
            if ! ssh-keygen -y -f ~/.ssh/seeker_deploy >/dev/null 2>&1; then
              echo "::error::Invalid SEEKER_DEPLOY_KEY. Paste full private key including BEGIN/END lines."
              exit 1
            fi
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/seeker_deploy
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            git remote add seeker "git@github.com:Seeker-x1/spray.git"
            git ls-remote seeker HEAD
            if git push seeker HEAD:main; then
              echo "Push OK"
            else
              git push seeker HEAD:main --force
              echo "Push OK (force)"
            fi
          elif [ "$pat_len" -ge 20 ]; then
            echo "=== Auth: PAT (HTTPS) ==="
            HTTP_CODE=$(curl -s -o /tmp/seeker-api.json -w "%{http_code}" \
              -H "Authorization: Bearer ${SEEKER_PUSH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Seeker-x1/spray")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::PAT cannot access Seeker-x1/spray (HTTP ${HTTP_CODE})."
              exit 1
            fi
            git remote add seeker "https://github.com/Seeker-x1/spray.git"
            AUTH_HEADER="AUTHORIZATION: bearer ${SEEKER_PUSH_TOKEN}"
            GIT_AUTH=(-c "http.https://github.com/.extraheader=${AUTH_HEADER}")
            git "${GIT_AUTH[@]}" ls-remote seeker HEAD
            git "${GIT_AUTH[@]}" push seeker HEAD:main || git "${GIT_AUTH[@]}" push seeker HEAD:main --force
          else
            echo "::error::Set SEEKER_DEPLOY_KEY (full private key) on momentum-create/spray Actions secrets."
            exit 1
          fi

          if [ -n "$SEEKER_GIT_EMAIL" ]; then
            echo "=== Optional Vercel trigger commit ==="
            SEEKER_NAME="${SEEKER_NAME:-Seeker-x1}"
            git -c user.name="$SEEKER_NAME" -c user.email="$SEEKER_GIT_EMAIL" \
              commit --allow-empty -m "chore: trigger Vercel deploy [automated]"
            if [ "$deploy_len" -ge 200 ]; then
              git push seeker HEAD:main
            else
              git "${GIT_AUTH[@]}" push seeker HEAD:main
            fi
          fi
