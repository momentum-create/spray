# 編集の push 先: momentum-create/spray（origin）
# Vercel が見る先: Seeker-x1/spray → main への push で自動 mirror
name: Sync to Seeker (Vercel)

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Seeker-x1/spray
        env:
          SEEKER_PUSH_TOKEN: ${{ secrets.SEEKER_PUSH_TOKEN }}
        run: |
          if [ -z "$SEEKER_PUSH_TOKEN" ]; then
            echo "::error::SEEKER_PUSH_TOKEN が未設定です。momentum-create/spray の Settings → Secrets → Actions に登録してください（README 参照）。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add seeker "https://x-access-token:${SEEKER_PUSH_TOKEN}@github.com/Seeker-x1/spray.git"
          git push seeker HEAD:main
